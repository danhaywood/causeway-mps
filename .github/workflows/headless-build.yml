name: Headless build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  headless-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Generate, model-check, and compile
        run: ./gradlew headlessBuild --no-daemon --stacktrace
