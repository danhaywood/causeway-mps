name: Headless build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  headless-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Read pinned Java versions
        id: java-versions
        shell: bash
        run: |
          mps_runtime=$(awk -F= '$1 == "mpsRuntimeJavaVersion" { print $2 }' gradle.properties)
          generated_java=$(awk -F= '$1 == "generatedJavaVersion" { print $2 }' gradle.properties)
          test -n "$mps_runtime" && test -n "$generated_java"
          echo "mps-runtime=$mps_runtime" >> "$GITHUB_OUTPUT"
          echo "generated-java=$generated_java" >> "$GITHUB_OUTPUT"

      - name: Set up MPS runtime JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ steps.java-versions.outputs.mps-runtime }}

      - name: Set up generated Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ steps.java-versions.outputs.generated-java }}

      - name: Bootstrap, generate, model-check, and compile
        run: ./gradlew headlessBuild --no-daemon --stacktrace
